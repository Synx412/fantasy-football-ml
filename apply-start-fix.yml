name: Apply ML start-role fix

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply update
        run: |
          if [ -f streamlit_start_role_fix.zip ]; then
            unzip -o streamlit_start_role_fix.zip
            rm streamlit_start_role_fix.zip
          fi

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Fix starter role predictions"
          git push
