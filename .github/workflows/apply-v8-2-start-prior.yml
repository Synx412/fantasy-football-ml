name: Apply v8.2 preseason start-prior fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-v8-2-start-prior.yml"

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply generic preseason start-probability fix
        run: |
          echo "" | base64 --decode > /tmp/apply_v8_2.py
          python /tmp/apply_v8_2.py

      - name: Run focused regression
        run: python tests/preseason_start_prior_test.py

      - name: Run full smoke test
        run: python tests/smoke_test.py

      - name: Commit tested fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/model.py src/providers.py src/preseason_prior.py tests/preseason_start_prior_test.py

          if git diff --cached --quiet; then
            echo "Fix is already installed."
          else
            git commit -m "Fix preseason start probabilities with decaying role prior"
            git push
          fi
